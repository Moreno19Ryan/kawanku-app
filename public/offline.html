<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f9">
<title>Sedang offline · KawanKu</title>
<style>
  :root { --bg: #f4f5f9; --surface: #ffffff; --fg: #14161c; --muted: #6b7080; --primary: #026e9a; --primary-fg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0c10; --surface: #17181d; --fg: #f2f3f6; --muted: #9a9fad; --primary: #2bb3ea; --primary-fg: #06202b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 360px; background: var(--surface); border-radius: 26px; padding: 32px 24px; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 22px; margin: 16px 0 8px; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  button { margin-top: 20px; height: 44px; padding: 0 24px; border: 0; border-radius: 999px;
    background: var(--primary); color: var(--primary-fg); font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/brand/mark.svg" alt="KawanKu">
  <h1>Sedang offline</h1>
  <p>KawanKu butuh internet untuk menampilkan data dan mencatat absensi. Periksa koneksi HP-mu, lalu coba lagi.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
